<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Glideo Reframe Trail mark. Standalone colors (no currentColor) so the
       ghost frames stay visible on both light and dark browser chrome. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6a5cd8"/><stop offset="0.5" stop-color="#a06bd4"/><stop offset="1" stop-color="#e0446f"/>
    </linearGradient>
  </defs>
  <rect x="2" y="37" width="26" height="15" rx="5" fill="#8e8e96" opacity="0.4"/>
  <rect x="12" y="26" width="22" height="22" rx="7" fill="#8e8e96" opacity="0.6"/>
  <rect x="36" y="8" width="25" height="44" rx="8" fill="url(#g)"/>
  <circle cx="48.5" cy="30" r="4" fill="#fff"/>
</svg>
